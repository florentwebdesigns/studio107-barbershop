<!-- Dev tool: bakes ez-tree (MIT) procedural trees into public/drone/trees.glb. Run via tools/bake-trees.cjs. -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { Tree } from '/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js';

// name, preset, seed, target height (m), leaf count (null = preset), leaf tint (null = preset)
const LIST = [
  ['pineA', 'Pine Large', 11, 17, null, null],
  ['pineB', 'Pine Large', 27, 14, null, null],
  ['pineC', 'Pine Medium', 5, 9, null, null],
  ['oakBareA', 'Oak Large', 3, 15, 0, null],
  ['oakBareB', 'Ash Large', 8, 13, 0, null],
  ['ashBare', 'Ash Medium', 4, 9, 0, null],
  ['maple', 'Oak Small', 9, 5, null, 0xc23a2a],
  ['streetTree', 'Ash Medium', 12, 8, 6, 0xb8c470],
  ['bushGreen', 'Bush 1', 2, 1.5, null, null],
  ['bushRed', 'Bush 2', 6, 1.3, null, 0x9a2a2a],
  ['bushDark', 'Bush 3', 7, 1.1, null, 0x6f8a55],
];

window.bake = async () => {
  const root = new THREE.Group();
  const matCache = new Map();
  const toStd = (m) => {
    if (matCache.has(m)) return matCache.get(m);
    const s = new THREE.MeshStandardMaterial({
      name: m.name, map: m.map || null, normalMap: m.normalMap || null, aoMap: m.aoMap || null,
      roughnessMap: m.roughnessMap || null, color: m.color, roughness: 1, metalness: 0,
      alphaTest: m.alphaTest || 0, transparent: false, side: m.side,
    });
    matCache.set(m, s);
    return s;
  };
  for (const [name, preset, seed, h, count, tint] of LIST) {
    const t = new Tree();
    t.loadPreset(preset);
    t.options.seed = seed;
    if (count !== null) t.options.leaves.count = count;
    if (tint !== null) t.options.leaves.tint = tint;
    t.generate();
    const box = new THREE.Box3().setFromObject(t);
    const s = h / (box.max.y - box.min.y);
    const g = new THREE.Group();
    g.name = name;
    t.traverse((o) => {
      if (o.isMesh && o.geometry.attributes.position && o.geometry.attributes.position.count) {
        const geo = o.geometry.clone();
        geo.scale(s, s, s);
        const m = new THREE.Mesh(geo, toStd(o.material));
        m.name = name + '_' + (o.material.name || 'mesh');
        g.add(m);
      }
    });
    root.add(g);
  }
  const ex = new GLTFExporter();
  const buf = await ex.parseAsync(root, { binary: true });
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
window.ready = true;
</script>
